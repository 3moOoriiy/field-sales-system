version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: fs_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fs_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV}
      DATABASE_URL: ${DATABASE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES: ${JWT_ACCESS_EXPIRES}
      JWT_REFRESH_EXPIRES: ${JWT_REFRESH_EXPIRES}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE}
      CORS_ORIGINS: ${CORS_ORIGINS}
      UPLOAD_DIR: ${UPLOAD_DIR}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB}
      PORT: ${BACKEND_PORT}
    ports:
      - "${BACKEND_PORT}:3000"
    volumes:
      - uploads:/app/uploads

  admin-dashboard:
    build:
      context: ./admin-dashboard
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: fs_admin
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${ADMIN_PORT}:80"

  agent-pwa:
    build:
      context: ./agent-pwa
      dockerfile: Dockerfile
      args:
        VITE_AGENT_API_URL: ${VITE_AGENT_API_URL}
    container_name: fs_agent
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${AGENT_PORT}:80"

volumes:
  pgdata:
  uploads:
